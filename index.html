<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>假日逃離計畫 - 今晚睡哪裡？先報名再說</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #F9F6F0;
      --bg-section: #F2EAE5;
      --bg-card: #FFFDFB;
      --green-dark: #8A5F5F;
      --green-dark-hover: #754E4E;
      --green: #C88A75;
      --green-hover: #B27763;
      --brown: #C88A75;
      --brown-hover: #B27763;
      --text-main: #4A3B3B;
      --text-secondary: #7A6969;
      --text-disabled: #B8ADA9;
      --border: #E8DCD5;
      --success-bg: #EFE3E2;
      --success-text: #8A5F5F;
      --shadow: 0 4px 16px rgba(138, 95, 95, 0.08);
    }

    /* 👴 年紀友善基礎字級 (16px base) */
    html {
      font-size: 16px;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    .btn-rounded {
      border-radius: 10px;
    }

    .card-outdoor {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .card-outdoor:hover {
      border-color: #D8C2B8;
      transform: translateY(-2px);
    }

    .input-outdoor {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 1rem;
    }

    .input-outdoor:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(200, 138, 117, 0.15);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #e2d2ca;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚡ Supabase 連線設定
    const SUPABASE_URL = "https://tmkiawfnjmkruncodpql.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MEa8eCTpoPqwdK9BfKUdqA_Yen0Q3E4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AVATAR_COLORS = [
      { bg: '#EFE3E2', text: '#8A5F5F' },
      { bg: '#F8E8DF', text: '#B86B52' },
      { bg: '#F2EAE5', text: '#4A3B3B' },
      { bg: '#EADFD9', text: '#8A5F5F' },
      { bg: '#E8DCD5', text: '#C88A75' }
    ];

    function App() {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('連線雲端逃離基地...');
      const [currentView, setCurrentView] = useState('list');
      const [selectedEvent, setSelectedEvent] = useState(null);
      
      // Modals
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [editingRegister, setEditingRegister] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');

      // 📢 逃離基地公告 State
      const [noticeText, setNoticeText] = useState(() => {
        return localStorage.getItem('camporder_notice') || '歡迎來到假日逃離計畫！今晚睡哪裡？先報名再說～暫別城市的喧囂，一起到戶外渡假吧！';
      });
      const [showNoticeModal, setShowNoticeModal] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [noticeInput, setNoticeInput] = useState('');

      const loadNoticeFromSupabase = async () => {
        // 1. 嘗試從專用 announcements 資料表讀取
        try {
          const { data } = await supabase.from('announcements').select('*').eq('id', 1).single();
          if (data && data.content) {
            setNoticeText(data.content);
            localStorage.setItem('camporder_notice', data.content);
            return;
          }
        } catch (err) {
          // 忽略
        }

        // 2. 備用：從 events 表讀取 system-notice 紀錄
        try {
          const { data } = await supabase.from('events').select('description').eq('id', 'system-notice').single();
          if (data && data.description) {
            setNoticeText(data.description);
            localStorage.setItem('camporder_notice', data.description);
          }
        } catch (err) {
          // 忽略
        }
      };

      useEffect(() => {
        loadNoticeFromSupabase();
      }, []);

      const handleOpenNoticeEdit = () => {
        setPasswordInput('');
        setPasswordError('');
        setNoticeInput(noticeText);
        setShowNoticeModal(true);
      };

      const handleSaveNotice = async () => {
        if (passwordInput.trim() !== 'YBSG') {
          setPasswordError('密碼錯誤！無法編輯公告');
          return;
        }
        const newNotice = noticeInput.trim();
        setNoticeText(newNotice);
        localStorage.setItem('camporder_notice', newNotice);
        setShowNoticeModal(false);

        let savedToCloud = false;

        // 優先嘗試寫入專用 announcements 表
        try {
          const { error } = await supabase.from('announcements').upsert([{ id: 1, content: newNotice }]);
          if (!error) savedToCloud = true;
        } catch (err) {
          console.log("Announcements table sync note:", err);
        }

        // 備用方案：同步寫入 events 表中的 system-notice 系統紀錄（確保持續雲端跨裝置同步）
        try {
          const { error } = await supabase.from('events').upsert([{ 
            id: 'system-notice', 
            title: 'SYSTEM_NOTICE', 
            location: 'NOTICE', 
            startDate: '2000-01-01', 
            endDate: '2000-01-01', 
            organizer: 'SYSTEM', 
            description: newNotice 
          }]);
          if (!error) savedToCloud = true;
        } catch (err) {
          console.error("Notice fallback sync error:", err);
        }

        if (savedToCloud) {
          alert('公告已成功更新並同步至全站裝置！');
          loadNoticeFromSupabase();
        } else {
          alert('公告已儲存於本機，但雲端同步失敗。請確認網路與資料庫連線。');
        }
      };

      const loadEventsFromSupabase = async () => {
        setLoading(true);
        setSyncStatus('正在同步最新逃離計畫...');
        try {
          const { data: eventsData, error: evErr } = await supabase
            .from('events')
            .select('*')
            .order('startDate', { ascending: false });

          if (evErr) throw evErr;

          // 讀取系統公告（如果有）
          const sysNotice = (eventsData || []).find(evt => evt.id === 'system-notice');
          if (sysNotice && sysNotice.description) {
            setNoticeText(sysNotice.description);
            localStorage.setItem('camporder_notice', sysNotice.description);
          }

          const { data: regsData, error: regErr } = await supabase
            .from('registrations')
            .select('*');

          if (regErr) throw regErr;

          const eventsMap = (eventsData || [])
            .filter(evt => evt.id !== 'system-notice' && evt.title !== 'SYSTEM_NOTICE')
            .map(evt => {
              const regs = (regsData || []).filter(r => String(r.eventId) === String(evt.id));
              return {
                ...evt,
                registrations: regs
              };
            });

          // 前端再次確認依活動日期 (startDate) 降序排序
          eventsMap.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));

          setEvents(eventsMap);

          if (selectedEvent) {
            const updatedSel = eventsMap.find(e => String(e.id) === String(selectedEvent.id));
            setSelectedEvent(updatedSel || null);
          }

          setSyncStatus('雲端資料同步中');
        } catch (err) {
          console.error("Supabase fetch error:", err);
          setSyncStatus('連線失敗，請確認 SQL 欄位');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadEventsFromSupabase();

        const subscription = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => {
            loadEventsFromSupabase();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(subscription);
        };
      }, []);

      const filteredEvents = useMemo(() => {
        const term = searchTerm.toLowerCase().trim();
        if (!term) return events;
        return events.filter(e => 
          (e.title || '').toLowerCase().includes(term) ||
          (e.location || '').toLowerCase().includes(term) ||
          (e.organizer || '').toLowerCase().includes(term) ||
          (e.registrations || []).some(r => (r.name || '').toLowerCase().includes(term))
        );
      }, [events, searchTerm]);

      const todayStr = useMemo(() => new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0], []);

      const activeCount = useMemo(() => {
        return filteredEvents.filter(e => {
          const checkDate = e.startDate;
          return !checkDate || checkDate >= todayStr;
        }).length;
      }, [filteredEvents, todayStr]);

      const expiredCount = useMemo(() => {
        return filteredEvents.filter(e => {
          const checkDate = e.startDate;
          return checkDate && checkDate < todayStr;
        }).length;
      }, [filteredEvents, todayStr]);

      const handleRegisterSubmit = async (eventId, regData) => {
        const newReg = { 
          id: 'reg-' + Date.now(),
          eventId: String(eventId),
          name: regData.name,
          phone: '',
          tents: Number(regData.tents || 1),
          adults: Number(regData.adults || 0),
          kids: Number(regData.kids || 0),
          carNo: '',
          nightArrive: Boolean(regData.nightArrive),
          note: regData.note || ''
        };

        setShowRegisterModal(false);

        try {
          setSyncStatus('正在辦理活動報名...');
          const { error } = await supabase.from('registrations').insert([newReg]);
          if (error) throw error;

          setSyncStatus('成功報名這場活動！');
          alert('成功報名這場活動！一起準備出發吧～');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Register submit error:", err);
          alert('加入失敗：' + (err.message || '請檢查權限'));
        }
      };

      const handleUpdateRegistration = async (regId, updatedData) => {
        setEditingRegister(null);
        try {
          setSyncStatus('正在更新報名資料...');
          const { error } = await supabase
            .from('registrations')
            .update({
              name: updatedData.name,
              tents: Number(updatedData.tents || 1),
              adults: Number(updatedData.adults || 0),
              kids: Number(updatedData.kids || 0),
              nightArrive: Boolean(updatedData.nightArrive),
              note: updatedData.note || ''
            })
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('報名紀錄更新成功！');
          alert('逃離夥伴資料已修改！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update reg error:", err);
          alert('更新失敗：' + err.message);
        }
      };

      const handleCancelRegistration = async (eventId, regId) => {
        if (!confirm('確定要退出這場逃離計畫嗎？')) return;

        try {
          setSyncStatus('正在移除逃離夥伴...');
          const { error } = await supabase
            .from('registrations')
            .delete()
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('紀錄已移除');
          alert('已成功退出此活動');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete reg error:", err);
          alert('移除失敗：' + err.message);
        }
      };

      // 📤 發起揪團計畫 (拿掉發起人電話)
      const handleCreateEvent = async (newEventData) => {
        const newEvent = {
          id: 'evt-' + Date.now(),
          title: newEventData.title,
          location: newEventData.location,
          address: newEventData.address || '',
          startDate: newEventData.startDate,
          endDate: newEventData.endDate,
          deadlineDate: newEventData.deadlineDate || '',
          campUrl: newEventData.campUrl || '',
          organizer: newEventData.organizer,
          organizerPhone: '', // 拿掉發起人電話
          description: newEventData.description || ''
        };

        setShowCreateModal(false);

        try {
          setSyncStatus('正在發起揪團計畫...');
          const { error } = await supabase.from('events').insert([newEvent]);
          if (error) throw error;

          setSyncStatus('揪團計畫發起成功！');
          alert('假日逃離計畫發起成功！邀約朋友一起加入吧！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Create event error:", err);
          alert('發起失敗：' + (err.message || '請確認 SQL 是否執行新增欄位'));
        }
      };

      const handleUpdateEvent = async (eventId, updatedData) => {
        setEditingEvent(null);
        try {
          setSyncStatus('正在更新揪團計畫...');
          const { error } = await supabase
            .from('events')
            .update({
              title: updatedData.title,
              location: updatedData.location,
              address: updatedData.address || '',
              startDate: updatedData.startDate,
              endDate: updatedData.endDate,
              deadlineDate: updatedData.deadlineDate || '',
              campUrl: updatedData.campUrl || '',
              organizer: updatedData.organizer,
              organizerPhone: '', // 拿掉發起人電話
              description: updatedData.description || ''
            })
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('揪團計畫更新成功！');
          alert('活動內容已更新！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update event error:", err);
          alert('更新失敗：' + err.message);
        }
      };

      const handleDeleteEvent = async (eventId) => {
        if (!confirm('警告：確定要取消這整場假日逃離計畫嗎？所有夥伴資料將一併刪除。')) return;

        setSelectedEvent(null);

        try {
          setSyncStatus('正在刪除計畫...');
          const { error } = await supabase
            .from('events')
            .delete()
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('逃離計畫已刪除');
          alert('已刪除此逃離計畫');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete event error:", err);
          alert('刪除失敗：' + err.message);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* 頂部導覽列 Header */}
          <header class="bg-[#8A5F5F] text-[#FFFDFB] shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-5 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div 
                class="flex items-center justify-between w-full sm:w-auto cursor-pointer" 
                onClick={() => { setSelectedEvent(null); setCurrentView('list'); setSearchTerm(''); loadEventsFromSupabase(); }}>
                <div>
                  <h1 class="text-xl sm:text-2xl font-bold tracking-wide text-[#FFFDFB]">
                    假日逃離計畫
                  </h1>
                  <p class="text-xs sm:text-sm text-[#F4ECEB] font-medium mt-0.5">今晚睡哪裡？先報名再說</p>
                </div>

                <button 
                  onClick={(e) => { e.stopPropagation(); setShowCreateModal(true); }}
                  class="sm:hidden bg-[#C88A75] hover:bg-[#B27763] active:bg-[#9E6452] text-white border border-[#D89B87] font-bold px-3.5 py-2 btn-rounded text-sm shadow-sm">
                  發起揪團計畫
                </button>
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <button 
                  onClick={loadEventsFromSupabase}
                  title="重新載入數據"
                  class="bg-[#754E4E] hover:bg-[#634040] text-[#F4ECEB] text-xs sm:text-sm px-3.5 py-2 btn-rounded font-medium border border-[#B88A8A]/40">
                  重新整理
                </button>

                <div class="bg-[#754E4E]/80 p-1 rounded-xl flex gap-1 text-xs sm:text-sm font-medium">
                  <button 
                    onClick={() => { setCurrentView('list'); setSelectedEvent(null); }}
                    class={`px-3.5 py-2 btn-rounded transition ${currentView === 'list' ? 'bg-[#FFFDFB] text-[#4A3B3B] font-bold shadow-xs' : 'text-[#F4ECEB] hover:text-white'}`}>
                    逃離清單
                  </button>
                  <button 
                    onClick={() => { setCurrentView('calendar'); setSelectedEvent(null); }}
                    class={`px-3.5 py-2 btn-rounded transition ${currentView === 'calendar' ? 'bg-[#FFFDFB] text-[#4A3B3B] font-bold shadow-xs' : 'text-[#F4ECEB] hover:text-white'}`}>
                    逃離月曆
                  </button>
                </div>

                <button 
                  onClick={() => setShowCreateModal(true)}
                  class="hidden sm:flex bg-[#C88A75] hover:bg-[#B27763] active:bg-[#9E6452] text-white font-bold px-4 py-2.5 btn-rounded shadow-sm transition items-center text-base border border-[#D89B87]">
                  發起揪團計畫
                </button>
              </div>
            </div>
          </header>

          {/* 雲端同步狀態 */}
          <div class="bg-[#4A3B3B] text-[#F4ECEB] text-xs sm:text-sm py-2 px-5 text-center font-medium flex items-center justify-center gap-2">
            <span>{syncStatus}</span>
          </div>

          {/* 主要內容區 */}
          <main class="flex-grow max-w-6xl w-full mx-auto px-5 sm:px-6 lg:px-8 py-6">
            {selectedEvent ? (
              <EventDetailView 
                event={selectedEvent} 
                onBack={() => setSelectedEvent(null)}
                onOpenRegister={() => setShowRegisterModal(true)}
                onCancelReg={handleCancelRegistration}
                onDeleteEvent={handleDeleteEvent}
                onEditEvent={(evt) => setEditingEvent(evt)}
                onEditReg={(reg) => setEditingRegister(reg)}
              />
            ) : (
              <div>
                {/* 📢 逃離基地公告區 */}
                <div class="mb-6 bg-[#FFFDF8] p-4 sm:p-5 rounded-2xl border border-[#DDD8CB] shadow-xs overflow-hidden">
                  <div class="flex items-center justify-between border-b border-[#DDD8CB]/60 pb-2.5 mb-2.5">
                    <h3 class="font-bold text-[#3F5144] text-base sm:text-lg flex items-center gap-2">
                      <span>📢</span> 逃離基地公告
                    </h3>
                    <button 
                      onClick={handleOpenNoticeEdit}
                      class="text-xs sm:text-sm font-bold text-[#B8794A] hover:text-[#9F633D] px-3 py-1 rounded-lg bg-[#F0DED0]/60 hover:bg-[#F0DED0] transition border border-[#9A5E3D]/20 shrink-0">
                      編輯公告
                    </button>
                  </div>
                  <div class="px-1 py-0.5">
                    <p class="text-[#30332F] text-base sm:text-lg leading-relaxed whitespace-pre-line font-medium break-words">
                      {noticeText}
                    </p>
                  </div>
                </div>

                <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-[#FFFDF8] p-4 sm:p-4.5 rounded-2xl border border-[#DDD8CB] shadow-xs overflow-hidden">
                  <div class="relative w-full sm:w-80">
                    <input 
                      type="text"
                      placeholder="搜尋地點、營地、發起人或逃離夥伴..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      class="w-full px-4 py-2.5 input-outdoor text-base"
                    />
                  </div>

                  <div class="text-sm sm:text-base text-[#5A5F56] font-medium text-left sm:text-right w-full sm:w-auto">
                    目前共有 <span class="text-[#30332F] font-bold text-lg sm:text-xl">{filteredEvents.length}</span> 場逃離計畫 
                    （<span class="text-[#3F5144] font-bold">{activeCount}</span> 場進行中 / <span class="text-[#737970] font-bold">{expiredCount}</span> 場已結束）
                  </div>
                </div>

                {loading && events.length === 0 ? (
                  <div class="text-center py-20 bg-[#FFFDF8] rounded-2xl border border-[#DDD8CB]">
                    <p class="text-[#5A5F56] font-medium text-base">正在讀取最新的假日逃離計畫...</p>
                  </div>
                ) : (
                  currentView === 'list' ? (
                    <EventListView events={filteredEvents} onSelectEvent={setSelectedEvent} />
                  ) : (
                    <CalendarView events={events} onSelectEvent={setSelectedEvent} />
                  )
                )}
              </div>
            )}
          </main>

          {/* 頁尾 */}
          <footer class="bg-[#30332F] text-[#737970] py-8 border-t border-[#3F5144] text-center text-sm mt-12 space-y-1">
            <p class="text-[#E1E8DD] font-medium text-base">假日逃離計畫 - 今晚睡哪裡？先報名再說</p>
            <p class="text-[#AAA99F]">Outdoor Lifestyle & Escape Plan System</p>
          </footer>

          {/* Modals */}
          {showRegisterModal && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              onClose={() => setShowRegisterModal(false)}
              onSubmit={handleRegisterSubmit}
            />
          )}

          {showCreateModal && (
            <EventFormModal 
              title="發起揪團計畫"
              onClose={() => setShowCreateModal(false)}
              onSubmit={handleCreateEvent}
            />
          )}

          {editingEvent && (
            <EventFormModal 
              title="編輯揪團計畫"
              initialData={editingEvent}
              onClose={() => setEditingEvent(null)}
              onSubmit={(data) => handleUpdateEvent(editingEvent.id, data)}
            />
          )}

          {editingRegister && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              initialData={editingRegister}
              onClose={() => setEditingRegister(null)}
              onSubmit={(eventId, data) => handleUpdateRegistration(editingRegister.id, data)}
            />
          )}

                <div class="flex items-center justify-end gap-3 pt-2">

    // ----------------------------------------------------
    // 組件 1：活動卡片列表視圖 
    // 需求修改：
    // 1. 拿掉「尚有名額」標籤，僅在活動已過期時顯示「已結束」
    // 2. 拿掉發起人電話
    // 3. 活動排序：按活動日期 最慢/最晚的依次排序 (已在 loadEventsFromSupabase 做降序排序)
    // ----------------------------------------------------
    function EventCard({ evt, isExpired, onSelectEvent }) {
      const regs = evt.registrations || [];
      const totalPeople = regs.reduce((sum, r) => sum + Number(r.adults || 0) + Number(r.kids || 0), 0);
      const totalTents = regs.reduce((sum, r) => sum + Number(r.tents || 1), 0);

      const todayStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
      const isDeadlinePassed = !isExpired && Boolean(evt.deadlineDate && evt.deadlineDate < todayStr);

      return (
        <div 
          onClick={() => onSelectEvent(evt)}
          class={`p-4 sm:p-5 flex flex-col justify-between cursor-pointer group space-y-2.5 rounded-2xl border transition transform hover:-translate-y-0.5 ${
            isExpired 
              ? 'bg-[#F2EAE5] border-[#E8DCD5] opacity-90 hover:border-[#D8C2B8]' 
              : 'card-outdoor'
          }`}>
          
          <div>
            {/* 1. 卡片頂部：活動日期區塊與狀態標籤 */}
            <div class="border-b border-[#E8DCD5]/60 pb-2 mb-2">
              <div class="flex items-center justify-between gap-2 mb-0.5">
                <span class="text-sm font-bold text-[#7A6969]">活動日期</span>
                {isExpired ? (
                  <span class="bg-[#EBE3E0] text-[#887977] px-3 py-0.5 rounded-full text-xs sm:text-sm font-bold shrink-0">
                    已結束
                  </span>
                ) : isDeadlinePassed ? (
                  <span class="bg-[#F8E8DF] text-[#B86B52] px-3 py-0.5 rounded-full text-xs sm:text-sm font-bold shrink-0">
                    已截止報名
                  </span>
                ) : (
                  <span class="bg-[#EFE3E2] text-[#8A5F5F] px-3 py-0.5 rounded-full text-xs sm:text-sm font-bold shrink-0">
                    報名中
                  </span>
                )}
              </div>
              <div class={`font-bold text-lg sm:text-xl ${isExpired ? 'text-[#887977]' : 'text-[#C88A75]'}`}>
                {evt.startDate} ～ {evt.endDate}
              </div>
            </div>

            {/* 2. 中間活動大標題 */}
            <h3 class={`font-extrabold text-2xl sm:text-3xl transition line-clamp-1 mb-2.5 ${isExpired ? 'text-[#7A6969]' : 'text-[#4A3B3B] group-hover:text-[#8A5F5F]'}`}>
              {evt.title}
            </h3>

            {/* 3. 條列屬性 */}
            <div class="space-y-1 text-base sm:text-lg">
              {/* 地點 */}
              <div class="flex items-center justify-between py-0.5 border-b border-dashed border-[#E8DCD5]/40 gap-2">
                <span class="text-[#7A6969] font-medium shrink-0">逃離地點</span>
                <span class="font-bold text-[#4A3B3B] text-lg sm:text-xl text-right truncate">{evt.location}</span>
              </div>

              {/* 報名截止 */}
              <div class="flex items-center justify-between py-0.5 border-b border-dashed border-[#E8DCD5]/40 gap-2">
                <span class="text-[#7A6969] font-medium shrink-0">報名截止</span>
                <span class={`font-bold text-lg sm:text-xl text-right shrink-0 ${isExpired ? 'text-[#887977]' : 'text-[#C88A75]'}`}>
                  {evt.deadlineDate || '無期限'}
                </span>
              </div>

              {/* 發起人 */}
              <div class="flex items-center justify-between py-0.5 border-b border-dashed border-[#E8DCD5]/40 gap-2">
                <span class="text-[#7A6969] font-medium shrink-0">發起人</span>
                <span class="font-bold text-[#4A3B3B] text-lg sm:text-xl text-right truncate">{evt.organizer}</span>
              </div>

              {/* 目前夥伴 */}
              <div class="flex items-center justify-between py-0.5 gap-2">
                <span class="text-[#7A6969] font-medium shrink-0">目前夥伴</span>
                <span class={`font-bold text-lg sm:text-xl text-right shrink-0 ${isExpired ? 'text-[#887977]' : 'text-[#8A5F5F]'}`}>
                  {regs.length} 組 ({totalTents} 帳 / {totalPeople} 人)
                </span>
              </div>
            </div>
          </div>

          {/* 4. 底部引導 */}
          <div class="pt-2 border-t border-[#E8DCD5] flex items-center justify-between text-[#7A6969]">
            <span class="text-base font-medium">{isExpired ? '點擊查看歷史紀錄' : '點擊查看詳情與報名'}</span>
            <span class="text-lg font-bold text-[#8A5F5F] group-hover:translate-x-1 transition">➔</span>
          </div>
        </div>
      );
    }

    function EventListView({ events, onSelectEvent }) {
      if (events.length === 0) {
        return (
          <div class="text-center py-16 bg-[#FFFDF8] rounded-2xl border border-dashed border-[#DDD8CB]">
            <h3 class="text-xl font-bold text-[#30332F]">沒有找到相關的逃離計畫</h3>
            <p class="text-[#5A5F56] text-base mt-2">請嘗試搜尋其他地點、發起人或夥伴名字！</p>
          </div>
        );
      }

      const todayStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];

      const activeEvents = events.filter(evt => {
        const checkDate = evt.startDate;
        return !checkDate || checkDate >= todayStr;
      });

      const expiredEvents = events.filter(evt => {
        const checkDate = evt.startDate;
        return checkDate && checkDate < todayStr;
      });

      return (
        <div class="space-y-10">
          {/* 進行中 / 尚未開始的逃離計畫 */}
          {activeEvents.length > 0 && (
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {activeEvents.map(evt => (
                <EventCard key={evt.id} evt={evt} isExpired={false} onSelectEvent={onSelectEvent} />
              ))}
            </div>
          )}

          {/* 已結束的活動分隔線與卡片區 */}
          {expiredEvents.length > 0 && (
            <div class="space-y-6">
              <div class="relative flex py-4 items-center">
                <div class="flex-grow border-t border-[#DDD8CB]"></div>
                <span class="flex-shrink mx-4 px-4 py-1.5 bg-[#EEEADF] text-[#737970] rounded-full text-sm font-bold border border-[#DDD8CB] shadow-xs">
                  以下為已結束的逃離計畫
                </span>
                <div class="flex-grow border-t border-[#DDD8CB]"></div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {expiredEvents.map(evt => (
                  <EventCard key={evt.id} evt={evt} isExpired={true} onSelectEvent={onSelectEvent} />
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 2：月曆視圖
    // ----------------------------------------------------
    function CalendarView({ events, onSelectEvent }) {
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      const firstDayOfWeek = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth() + 1;

      const calendarDays = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        calendarDays.push(null);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarDays.push({ day: d, dateStr });
      }

      return (
        <div class="bg-[#FFFDF8] rounded-2xl p-4 sm:p-6 border border-[#DDD8CB] shadow-xs overflow-hidden">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 sm:mb-6">
            <h2 class="text-xl sm:text-2xl font-bold text-[#3F5144]">
              {year} 年 {month} 月 逃離月曆
            </h2>
            <div class="flex items-center gap-2 justify-between">
              <button onClick={() => setCurrentMonth(new Date(year, month - 2, 1))} class="px-3 py-2 bg-[#EEEADF] hover:bg-[#E4DCCB] rounded-lg text-sm font-bold text-[#30332F]">◀ 上個月</button>
              <button onClick={() => setCurrentMonth(new Date())} class="px-3 py-2 bg-[#E1E8DD] text-[#52664F] hover:bg-[#D9DFD1] rounded-lg text-sm font-bold">今天</button>
              <button onClick={() => setCurrentMonth(new Date(year, month, 1))} class="px-3 py-2 bg-[#EEEADF] hover:bg-[#E4DCCB] rounded-lg text-sm font-bold text-[#30332F]">下個月 ▶</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-sm font-bold text-[#5A5F56] mb-2">
            <div class="text-[#B8794A]">日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div class="text-[#3F5144]">六</div>
          </div>

          <div class="grid grid-cols-7 gap-1 sm:gap-2">
            {calendarDays.map((cell, idx) => {
              if (!cell) return <div key={'empty-' + idx} class="h-16 sm:h-28 bg-[#F5F1E8]/40 rounded-lg sm:rounded-xl"></div>;

              const dayEvents = events.filter(e => cell.dateStr >= e.startDate && cell.dateStr <= e.endDate);
              const hasEvents = dayEvents.length > 0;

              return (
                <div key={cell.dateStr} class="min-h-[64px] sm:h-28 bg-[#F5F1E8] hover:bg-[#EEEADF] p-1.5 sm:p-2 rounded-lg sm:rounded-xl border border-[#DDD8CB]/60 flex flex-col justify-between overflow-hidden">
                  <div class="flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-[#30332F]">{cell.day}</span>
                    {hasEvents && <span class="sm:hidden text-[10px] bg-[#3F5144] text-white px-1.5 py-0.2 rounded-full font-bold">{dayEvents.length}</span>}
                  </div>
                  
                  <div class="space-y-1 overflow-y-auto custom-scrollbar flex-grow mt-1">
                    {dayEvents.map(evt => (
                      <div 
                        key={evt.id}
                        onClick={() => onSelectEvent(evt)}
                        class="bg-[#3F5144] text-[#FFFDF8] text-xs sm:text-sm p-1 sm:p-1.5 rounded sm:rounded-lg cursor-pointer hover:bg-[#2F3D33] transition font-medium leading-tight truncate"
                        title={evt.title}>
                        {evt.title}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 3：活動詳情 (過期活動不能進行任何編輯)
    // ----------------------------------------------------
    function EventDetailView({ event, onBack, onOpenRegister, onCancelReg, onDeleteEvent, onEditEvent, onEditReg }) {
      const regs = event.registrations || [];
      const totalTents = regs.reduce((sum, r) => sum + Number(r.tents || 1), 0);
      const totalAdults = regs.reduce((sum, r) => sum + Number(r.adults || 0), 0);
      const totalKids = regs.reduce((sum, r) => sum + Number(r.kids || 0), 0);
      const totalPeople = totalAdults + totalKids;

      const todayStr = new Date(new Date().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().split('T')[0];
      const checkDate = event.startDate;

                    編輯計畫

                  <button 
                    onClick={() => onDeleteEvent(event.id)}
                    class="inline-flex items-center gap-1 text-xs sm:text-sm font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 px-3.5 py-2.5 btn-rounded border border-rose-200">

                <div class="flex items-center gap-2 mb-2 flex-wrap">

              <button

                    ? 'bg-[#EBE3E0] text-[#887977] cursor-not-allowed' 
                    : 'bg-[#C88A75] hover:bg-[#B27763] text-[#FFFDFB]'
                }`}>
                {isExpired ? '已結束' : '報名這場活動'}

            <p class="text-[#4A3B3B] text-base sm:text-lg leading-relaxed whitespace-pre-line bg-[#F9F6F0] p-4.5 rounded-xl border border-[#E8DCD5]/60">

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-[#F2EAE5] p-4 rounded-xl text-sm sm:text-base">
              <div>
                <span class="text-[#7A6969] block text-xs sm:text-sm">活動日期</span>
                <span class="font-bold text-[#C88A75] mt-0.5 block">{event.startDate} ～ {event.endDate}</span>
              </div>
              <div>
                <span class="text-[#7A6969] block text-xs sm:text-sm">目前統計</span>
                <span class="font-bold text-[#8A5F5F] mt-0.5 block">{regs.length} 組 ({totalTents} 帳 / {totalPeople} 人)</span>

        </div>

    // ----------------------------------------------------
    // Modal 1：加入逃離 Modal
    // ----------------------------------------------------
    function RegisterModal({ event, initialData, onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        name: initialData ? initialData.name : '',
        tents: initialData ? (initialData.tents || 1) : 1,
        adults: initialData ? (initialData.adults || 2) : 2,
        kids: initialData ? (initialData.kids || 0) : 0,
        nightArrive: initialData ? Boolean(initialData.nightArrive) : false,
        note: initialData ? (initialData.note || '') : ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name) {
          alert('請填寫暱稱！');
          return;
        }
        onSubmit(event.id, formData);
      };

      return (
        <div class="fixed inset-0 bg-[#4A3B3B]/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div class="bg-[#FFFDFB] rounded-2xl max-w-lg w-full p-6 shadow-xl border border-[#E8DCD5] max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b border-[#E8DCD5] pb-3">
              <h3 class="text-lg sm:text-xl font-bold text-[#4A3B3B]">
                {initialData ? '修改夥伴資料' : '報名這場活動'}
              </h3>
              <button onClick={onClose} class="text-[#7A6969] hover:text-[#4A3B3B] p-1 text-xl">✕</button>
            </div>

            <p class="text-xs sm:text-sm text-[#8A5F5F] bg-[#EFE3E2] p-3 rounded-lg mt-3 font-bold">
              計畫：{event.title} ({event.startDate})
            </p>

            <form onSubmit={handleSubmit} class="mt-4 space-y-4 text-base">
              <div>
                <label class="block font-bold text-[#4A3B3B] mb-1">暱稱 / 稱呼 *</label>
                <input 
                  type="text" required
                  value={formData.name}
                  onChange={e => setFormData({...formData, name: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                />
              </div>

              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">搭帳數量</label>
                  <select 
                    value={formData.tents}
                    onChange={e => setFormData({...formData, tents: Number(e.target.value)})}
                    class="w-full p-2.5 input-outdoor">
                    <option value={1}>1 帳</option>
                    <option value={2}>2 帳</option>
                    <option value={3}>3 帳</option>
                  </select>
                </div>
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">大人人數</label>
                  <input 
                    type="number" min="1" max="10"
                    value={formData.adults}
                    onChange={e => setFormData({...formData, adults: Number(e.target.value)})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">小孩人數</label>
                  <input 
                    type="number" min="0" max="10"
                    value={formData.kids}
                    onChange={e => setFormData({...formData, kids: Number(e.target.value)})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
              </div>

              <div class="flex items-center gap-2 bg-[#F9F6F0] p-3 rounded-xl border border-[#E8DCD5]">
                <input 
                  type="checkbox" 
                  id="nightArrive"
                  checked={formData.nightArrive}
                  onChange={e => setFormData({...formData, nightArrive: e.target.checked})}
                  class="w-5 h-5 text-[#8A5F5F] rounded"
                />
                <label htmlFor="nightArrive" class="text-sm text-[#4A3B3B] font-bold cursor-pointer">
                  預計週五「夜衝」(時間依發起人說明)
                </label>
              </div>

              <div>
                <label class="block font-bold text-[#4A3B3B] mb-1">備註 / 需求說明</label>
                <textarea 
                  rows="2"
                  value={formData.note}
                  onChange={e => setFormData({...formData, note: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                ></textarea>
              </div>

              <div class="flex justify-end gap-3 pt-3 border-t border-[#E8DCD5]">
                <button type="button" onClick={onClose} class="px-5 py-2.5 text-[#7A6969] font-bold">取消</button>
                <button type="submit" class="px-7 py-2.5 bg-[#C88A75] hover:bg-[#B27763] text-[#FFFDFB] font-bold btn-rounded shadow-sm text-base">
                  {initialData ? '儲存修改' : '報名這場活動'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Modal 2：發起 & 編輯揪團計畫 Modal (拿掉發起人電話)
    // ----------------------------------------------------
    function EventFormModal({ title, initialData, onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        title: initialData ? initialData.title : '',
        location: initialData ? initialData.location : '',
        address: initialData ? (initialData.address || '') : '',
        startDate: initialData ? initialData.startDate : '',
        endDate: initialData ? initialData.endDate : '',
        deadlineDate: initialData ? (initialData.deadlineDate || '') : '',
        campUrl: initialData ? (initialData.campUrl || '') : '',
        organizer: initialData ? initialData.organizer : '',
        description: initialData ? (initialData.description || '') : ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.startDate || !formData.endDate || !formData.organizer) {
          alert('請完整填寫標題、日期與發起人資訊！');
          return;
        }
        onSubmit(formData);
      };

      return (
        <div class="fixed inset-0 bg-[#4A3B3B]/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div class="bg-[#FFFDFB] rounded-2xl max-w-xl w-full p-6 shadow-xl border border-[#E8DCD5] max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b border-[#E8DCD5] pb-3">
              <h3 class="text-lg sm:text-xl font-bold text-[#4A3B3B]">{title}</h3>
              <button onClick={onClose} class="text-[#7A6969] hover:text-[#4A3B3B] p-1 text-xl">✕</button>
            </div>

            <form onSubmit={handleSubmit} class="mt-4 space-y-4 text-base">
              <div>
                <label class="block font-bold text-[#4A3B3B] mb-1">逃離計畫名稱 *</label>
                <input 
                  type="text" required
                  placeholder="例: 露營區名稱"
                  value={formData.title}
                  onChange={e => setFormData({...formData, title: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">逃離地點 (縣市/鄉鎮) *</label>
                  <input 
                    type="text" required
                    placeholder="例: 埔里 / 尖石"
                    value={formData.location}
                    onChange={e => setFormData({...formData, location: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">發起人暱稱 *</label>
                  <input 
                    type="text" required
                    value={formData.organizer}
                    onChange={e => setFormData({...formData, organizer: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">開始日期 *</label>
                  <input 
                    type="date" required
                    value={formData.startDate}
                    onChange={e => setFormData({...formData, startDate: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
                <div>
                  <label class="block font-bold text-[#4A3B3B] mb-1">結束日期 *</label>
                  <input 
                    type="date" required
                    value={formData.endDate}
                    onChange={e => setFormData({...formData, endDate: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
                <div>
                  <label class="block font-bold text-[#C88A75] mb-1">報名截止日</label>
                  <input 
                    type="date"
                    value={formData.deadlineDate}
                    onChange={e => setFormData({...formData, deadlineDate: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
              </div>

              <div>
                <label class="block font-bold text-[#4A3B3B] mb-1">營地連結網址 (選填)</label>
                <input 
                  type="url"
                  placeholder="https://..."
                  value={formData.campUrl}
                  onChange={e => setFormData({...formData, campUrl: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                />
              </div>

              <div>
                <label class="block font-bold text-[#4A3B3B] mb-1">計畫簡介與裝備提醒</label>
                <textarea 
                  rows="3"
                  placeholder="介紹營地特色、注意事項、伙食規劃..."
                  value={formData.description}
                  onChange={e => setFormData({...formData, description: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                ></textarea>
              </div>

              <div class="flex justify-end gap-3 pt-3 border-t border-[#E8DCD5]">
                <button type="button" onClick={onClose} class="px-5 py-2.5 text-[#7A6969] font-bold">取消</button>
                <button type="submit" class="px-7 py-2.5 bg-[#C88A75] hover:bg-[#B27763] text-[#FFFDFB] font-bold btn-rounded shadow-sm text-base">
                  {initialData ? '儲存修改' : '發起揪團計畫'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
