<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏕️ 露營趣 - 露營活動發起與報名系統 (Supabase 極速版)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚡ 您的 Supabase 雲端資料庫設定
    const SUPABASE_URL = "https://tmkiawfnjmkruncodpql.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MEa8eCTpoPqwdK9BfKUdqA_Yen0Q3E4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function App() {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('⚡ 正在連線 Supabase 極速資料庫...');
      const [currentView, setCurrentView] = useState('list'); // 'list' | 'calendar'
      const [selectedEvent, setSelectedEvent] = useState(null);
      
      // Modals
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null); // 正在編輯的活動
      const [editingRegister, setEditingRegister] = useState(null); // 正在編輯的報名紀錄

      const [searchTerm, setSearchTerm] = useState('');

      // 📥 從 Supabase 讀取最新活動與報名資料
      const loadEventsFromSupabase = async () => {
        setLoading(true);
        setSyncStatus('⚡ 正在載入雲端數據...');
        try {
          const { data: eventsData, error: evErr } = await supabase
            .from('events')
            .select('*')
            .order('created_at', { ascending: false });

          if (evErr) throw evErr;

          const { data: regsData, error: regErr } = await supabase
            .from('registrations')
            .select('*');

          if (regErr) throw regErr;

          const eventsMap = (eventsData || []).map(evt => {
            const regs = (regsData || []).filter(r => String(r.eventId) === String(evt.id));
            return {
              ...evt,
              registrations: regs
            };
          });

          setEvents(eventsMap);

          if (selectedEvent) {
            const updatedSel = eventsMap.find(e => String(e.id) === String(selectedEvent.id));
            setSelectedEvent(updatedSel || null);
          }

          setSyncStatus('⚡ 雲端實時同步中 (Supabase 極速回應)');
        } catch (err) {
          console.error("Supabase fetch error:", err);
          setSyncStatus('⚠️ 連線失敗，請確認資料庫權限');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadEventsFromSupabase();

        // 開啟 Supabase Realtime 訂閱
        const subscription = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => {
            loadEventsFromSupabase();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(subscription);
        };
      }, []);

      const filteredEvents = useMemo(() => {
        return events.filter(e => 
          (e.title || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.location || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.organizer || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [events, searchTerm]);

      // 📤 新增報名
      const handleRegisterSubmit = async (eventId, regData) => {
        const newReg = { 
          id: 'reg-' + Date.now(),
          eventId: String(eventId),
          name: regData.name,
          phone: regData.phone,
          tents: Number(regData.tents || 1),
          adults: Number(regData.adults || 0),
          kids: Number(regData.kids || 0),
          carNo: regData.carNo || '',
          nightArrive: Boolean(regData.nightArrive),
          note: regData.note || ''
        };

        setShowRegisterModal(false);

        try {
          setSyncStatus('⚡ 正在秒速寫入 Supabase...');
          const { error } = await supabase.from('registrations').insert([newReg]);
          if (error) throw error;

          setSyncStatus('✅ 報名已瞬時完成！');
          alert('🎉 報名成功！資料已秒速寫入雲端，手機電腦自動同步！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Register submit error:", err);
          alert('⚠️ 報名失敗：' + (err.message || '請檢查資料庫權限'));
        }
      };

      // ✏️ 修改 / 更新報名資料
      const handleUpdateRegistration = async (regId, updatedData) => {
        setEditingRegister(null);
        try {
          setSyncStatus('⚡ 正在更新報名資料...');
          const { error } = await supabase
            .from('registrations')
            .update({
              name: updatedData.name,
              phone: updatedData.phone,
              tents: Number(updatedData.tents || 1),
              adults: Number(updatedData.adults || 0),
              kids: Number(updatedData.kids || 0),
              carNo: updatedData.carNo || '',
              nightArrive: Boolean(updatedData.nightArrive),
              note: updatedData.note || ''
            })
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('✅ 報名紀錄更新成功！');
          alert('✏️ 報名資料已成功修改！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update reg error:", err);
          alert('⚠️ 更新報名失敗：' + err.message);
        }
      };

      // 🗑️ 取消 / 刪除報名
      const handleCancelRegistration = async (eventId, regId) => {
        if (!confirm('確定要取消/刪除這筆報名紀錄嗎？此動作將同步從雲端資料庫刪除。')) return;

        try {
          setSyncStatus('⚡ 正在從雲端刪除報名...');
          const { error } = await supabase
            .from('registrations')
            .delete()
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('✅ 報名已成功刪除');
          alert('🗑️ 報名已成功刪除！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete reg error:", err);
          alert('⚠️ 刪除報名失敗：' + err.message);
        }
      };

      // 📤 新增發起活動
      const handleCreateEvent = async (newEventData) => {
        const newEvent = {
          id: 'evt-' + Date.now(),
          title: newEventData.title,
          location: newEventData.location,
          address: newEventData.address || '',
          startDate: newEventData.startDate,
          endDate: newEventData.endDate,
          maxTents: Number(newEventData.maxTents || 6),
          feePerTent: Number(newEventData.feePerTent || 0),
          organizer: newEventData.organizer,
          organizerPhone: newEventData.organizerPhone || '',
          paymentInfo: newEventData.paymentInfo || '',
          imageUrl: newEventData.imageUrl || '',
          description: newEventData.description || ''
        };

        setShowCreateModal(false);

        try {
          setSyncStatus('⚡ 正在將新活動秒速寫入 Supabase...');
          const { error } = await supabase.from('events').insert([newEvent]);
          if (error) throw error;

          setSyncStatus('✅ 活動發起成功！');
          alert('🏕️ 露營活動發起成功！資料已秒速同步至雲端。');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Create event error:", err);
          alert('⚠️ 發起活動失敗：' + (err.message || '請確認授權權限'));
        }
      };

      // ✏️ 修改 / 更新活動資訊
      const handleUpdateEvent = async (eventId, updatedData) => {
        setEditingEvent(null);
        try {
          setSyncStatus('⚡ 正在更新活動內容...');
          const { error } = await supabase
            .from('events')
            .update({
              title: updatedData.title,
              location: updatedData.location,
              address: updatedData.address || '',
              startDate: updatedData.startDate,
              endDate: updatedData.endDate,
              maxTents: Number(updatedData.maxTents || 6),
              feePerTent: Number(updatedData.feePerTent || 0),
              organizer: updatedData.organizer,
              organizerPhone: updatedData.organizerPhone || '',
              paymentInfo: updatedData.paymentInfo || '',
              imageUrl: updatedData.imageUrl || '',
              description: updatedData.description || ''
            })
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('✅ 活動內容更新成功！');
          alert('✏️ 活動資訊已成功修改！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update event error:", err);
          alert('⚠️ 更新活動失敗：' + err.message);
        }
      };

      // 🗑️ 刪除整個露營活動
      const handleDeleteEvent = async (eventId) => {
        if (!confirm('⚠️ 警告：確定要刪除整個露營活動嗎？所有已報名的紀錄也將一併刪除，無法復原。')) return;

        setSelectedEvent(null);

        try {
          setSyncStatus('⚡ 正在刪除活動...');
          const { error } = await supabase
            .from('events')
            .delete()
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('✅ 活動已成功刪除');
          alert('🗑️ 活動已成功刪除！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete event error:", err);
          alert('⚠️ 刪除活動失敗：' + err.message);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* 頂部導覽列 Header */}
          <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="flex items-center gap-3 cursor-pointer" onClick={() => { setSelectedEvent(null); loadEventsFromSupabase(); }}>
                <span class="text-3xl">🏕️</span>
                <div>
                  <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    露營趣 CampOrder <span class="text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded font-bold">Supabase ⚡ 極速版</span>
                  </h1>
                  <p class="text-xs text-emerald-200">露營群組活動發起與自主報名系統</p>
                </div>
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button 
                  onClick={loadEventsFromSupabase}
                  title="手動刷新資料"
                  class="bg-emerald-900 hover:bg-emerald-950 text-emerald-100 text-xs px-3 py-2 rounded-lg flex items-center gap-1 border border-emerald-700 font-medium">
                  <span>🔄</span> 重新整理
                </button>

                {/* 視圖切換 */}
                <div class="bg-emerald-900/60 p-1 rounded-lg flex gap-1 text-sm font-medium">
                  <button 
                    onClick={() => { setCurrentView('list'); setSelectedEvent(null); }}
                    class={`px-3 py-1.5 rounded-md transition ${currentView === 'list' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-100 hover:text-white'}`}>
                    📋 活動列表
                  </button>
                  <button 
                    onClick={() => { setCurrentView('calendar'); setSelectedEvent(null); }}
                    class={`px-3 py-1.5 rounded-md transition ${currentView === 'calendar' ? 'bg-white text-emerald-900 shadow' : 'text-emerald-100 hover:text-white'}`}>
                    📅 日期總表
                  </button>
                </div>

                {/* 發起活動按鈕 */}
                <button 
                  onClick={() => setShowCreateModal(true)}
                  class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-1.5 rounded-lg shadow transition flex items-center gap-1.5 text-sm">
                  <span>➕</span> 發起團露
                </button>
              </div>
            </div>
          </header>

          {/* 雲端同步狀態標籤 */}
          <div class="bg-slate-900 text-emerald-400 text-xs py-1.5 px-4 text-center font-medium flex items-center justify-center gap-2 border-b border-slate-800">
            <span>{syncStatus}</span>
            {loading && <span class="animate-spin">⚡</span>}
          </div>

          {/* 主要內容區 Main Content */}
          <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
            {selectedEvent ? (
              <EventDetailView 
                event={selectedEvent} 
                onBack={() => setSelectedEvent(null)}
                onOpenRegister={() => setShowRegisterModal(true)}
                onCancelReg={handleCancelRegistration}
                onDeleteEvent={handleDeleteEvent}
                onEditEvent={(evt) => setEditingEvent(evt)}
                onEditReg={(reg) => setEditingRegister(reg)}
              />
            ) : (
              <div>
                {/* 搜尋與統計 Bar */}
                <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                  <div class="relative w-full sm:w-80">
                    <input 
                      type="text"
                      placeholder="搜尋營地名稱、地點或主辦人..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                    <span class="absolute left-3 top-2.5 text-slate-400">🔍</span>
                  </div>

                  <div class="text-sm text-slate-600 font-medium self-end sm:self-center">
                    目前共有 <span class="text-emerald-700 font-bold text-base">{filteredEvents.length}</span> 個活動
                  </div>
                </div>

                {loading && events.length === 0 ? (
                  <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-xs">
                    <div class="text-4xl animate-bounce mb-3">⚡</div>
                    <p class="text-slate-600 font-medium text-sm">正在連線 Supabase 資料庫...</p>
                  </div>
                ) : (
                  currentView === 'list' ? (
                    <EventListView events={filteredEvents} onSelectEvent={setSelectedEvent} />
                  ) : (
                    <CalendarView events={events} onSelectEvent={setSelectedEvent} />
                  )
                )}
              </div>
            )}
          </main>

          {/* 頁尾 Footer */}
          <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-center text-xs mt-12">
            <p>🏕️ 露營趣 CampOrder - 專為露營社群設計的免費線上報名平台</p>
            <p class="mt-1 text-slate-500">已連結 Supabase 專業 PostgreSQL 雲端資料庫 ⚡ 支援 Realtime 實時自動更新</p>
          </footer>

          {/* 報名彈出視窗 */}
          {showRegisterModal && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              onClose={() => setShowRegisterModal(false)}
              onSubmit={handleRegisterSubmit}
            />
          )}

          {/* 發起活動彈出視窗 */}
          {showCreateModal && (
            <EventFormModal 
              title="🏕️ 發起露營團露活動"
              onClose={() => setShowCreateModal(false)}
              onSubmit={handleCreateEvent}
            />
          )}

          {/* 編輯活動彈出視窗 */}
          {editingEvent && (
            <EventFormModal 
              title="✏️ 修改露營活動資訊"
              initialData={editingEvent}
              onClose={() => setEditingEvent(null)}
              onSubmit={(data) => handleUpdateEvent(editingEvent.id, data)}
            />
          )}

          {/* 編輯報名紀錄彈出視窗 */}
          {editingRegister && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              initialData={editingRegister}
              onClose={() => setEditingRegister(null)}
              onSubmit={(eventId, data) => handleUpdateRegistration(editingRegister.id, data)}
            />
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 1：活動卡片列表視圖
    // ----------------------------------------------------
    function EventListView({ events, onSelectEvent }) {
      if (events.length === 0) {
        return (
          <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
            <div class="text-5xl mb-3">🎪</div>
            <h3 class="text-lg font-bold text-slate-700">目前沒有找到任何露營活動</h3>
            <p class="text-slate-500 text-sm mt-1">點擊右上角的「發起團露」來建立第一個露營活動吧！</p>
          </div>
        );
      }

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          {events.map(evt => {
            const regs = evt.registrations || [];
            const totalBooked = regs.reduce((sum, r) => sum + Number(r.tents || 1), 0);
            const remainingTents = (evt.maxTents || 0) - totalBooked;
            const isFull = remainingTents <= 0;

            return (
              <div 
                key={evt.id} 
                onClick={() => onSelectEvent(evt)}
                class="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition cursor-pointer border border-slate-200/80 flex flex-col group">
                <div class="relative h-48 overflow-hidden bg-slate-100">
                  <img 
                    src={evt.imageUrl || "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=800&q=80"} 
                    alt={evt.title}
                    class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                  />
                  <div class="absolute top-3 left-3 bg-slate-900/75 backdrop-blur-sm text-white px-2.5 py-1 rounded-full text-xs font-semibold">
                    📍 {evt.location}
                  </div>
                  <div className={`absolute top-3 right-3 px-2.5 py-1 rounded-full text-xs font-bold shadow ${isFull ? 'bg-rose-500 text-white' : 'bg-emerald-500 text-white'}`}>
                    {isFull ? '🔴 已額滿' : `🟢 剩 ${remainingTents} 帳`}
                  </div>
                </div>

                <div class="p-5 flex-grow flex flex-col justify-between">
                  <div>
                    <h3 class="font-bold text-slate-800 text-lg group-hover:text-emerald-700 transition line-clamp-1">
                      {evt.title}
                    </h3>
                    
                    <div class="mt-3 space-y-1.5 text-xs text-slate-600">
                      <div class="flex items-center gap-1.5">
                        <span class="text-slate-400">📅 日期：</span>
                        <span class="font-medium text-slate-700">{evt.startDate} ～ {evt.endDate}</span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-slate-400">⛺ 規模：</span>
                        <span class="font-medium text-slate-700">限制 {evt.maxTents} 帳 (目前報名 {totalBooked} 帳)</span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-slate-400">💰 費用：</span>
                        <span class="font-medium text-emerald-700">NT$ {evt.feePerTent} / 帳</span>
                      </div>
                      <div class="flex items-center gap-1.5">
                        <span class="text-slate-400">👤 主辦：</span>
                        <span class="font-medium text-slate-700">{evt.organizer}</span>
                      </div>
                    </div>
                  </div>

                  <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                    <span class="text-slate-400">已報名：{regs.length} 組</span>
                    <span class="text-emerald-700 font-bold group-hover:translate-x-1 transition">查看詳情 & 報名 ➔</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 2：日曆總表視圖
    // ----------------------------------------------------
    function CalendarView({ events, onSelectEvent }) {
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      const firstDayOfWeek = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth() + 1;

      const calendarDays = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        calendarDays.push(null);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarDays.push({ day: d, dateStr });
      }

      return (
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
              <span>📅</span> {year} 年 {month} 月 露營行事曆
            </h2>
            <div class="flex items-center gap-2">
              <button onClick={() => setCurrentMonth(new Date(year, month - 2, 1))} class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium">◀ 上個月</button>
              <button onClick={() => setCurrentMonth(new Date())} class="px-3 py-1.5 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 rounded-lg text-sm font-medium">今天</button>
              <button onClick={() => setCurrentMonth(new Date(year, month, 1))} class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-medium">下個月 ▶</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-500 mb-2">
            <div class="text-rose-500">週日</div>
            <div>週一</div>
            <div>週二</div>
            <div>週三</div>
            <div>週四</div>
            <div>週五</div>
            <div class="text-emerald-600">週六</div>
          </div>

          <div class="grid grid-cols-7 gap-2">
            {calendarDays.map((cell, idx) => {
              if (!cell) return <div key={'empty-' + idx} class="h-28 bg-slate-50/50 rounded-xl"></div>;

              const dayEvents = events.filter(e => cell.dateStr >= e.startDate && cell.dateStr <= e.endDate);

              return (
                <div key={cell.dateStr} class="h-28 bg-slate-50 hover:bg-slate-100/80 p-2 rounded-xl border border-slate-200/60 flex flex-col justify-between overflow-hidden">
                  <div class="text-xs font-bold text-slate-600">{cell.day}</div>
                  <div class="space-y-1 overflow-y-auto custom-scrollbar flex-grow mt-1">
                    {dayEvents.map(evt => (
                      <div 
                        key={evt.id}
                        onClick={() => onSelectEvent(evt)}
                        class="bg-emerald-700 text-white text-[11px] p-1.5 rounded-lg cursor-pointer hover:bg-emerald-800 transition truncate font-medium"
                        title={evt.title}>
                        ⛺ {evt.title}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 3：活動詳細視圖 & 已報名名單
    // ----------------------------------------------------
    function EventDetailView({ event, onBack, onOpenRegister, onCancelReg, onDeleteEvent, onEditEvent, onEditReg }) {
      const regs = event.registrations || [];
      const totalBookedTents = regs.reduce((sum, r) => sum + Number(r.tents || 1), 0);
      const totalAdults = regs.reduce((sum, r) => sum + Number(r.adults || 0), 0);
      const totalKids = regs.reduce((sum, r) => sum + Number(r.kids || 0), 0);
      const remainingTents = (event.maxTents || 0) - totalBookedTents;
      const isFull = remainingTents <= 0;

      return (
        <div class="space-y-6">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <button 
              onClick={onBack}
              class="inline-flex items-center gap-1 text-sm font-medium text-emerald-800 hover:text-emerald-900 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
              ⬅ 返回活動列表
            </button>

            <div class="flex items-center gap-2">
              <button 
                onClick={() => onEditEvent(event)}
                class="inline-flex items-center gap-1 text-xs font-bold text-amber-800 bg-amber-100 hover:bg-amber-200 px-3.5 py-2 rounded-xl border border-amber-200 transition">
                ✏️ 編輯活動資訊
              </button>

              <button 
                onClick={() => onDeleteEvent(event.id)}
                class="inline-flex items-center gap-1 text-xs font-bold text-rose-600 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 px-3.5 py-2 rounded-xl border border-rose-200 transition">
                🗑️ 刪除活動
              </button>
            </div>
          </div>

          <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 grid grid-cols-1 lg:grid-cols-3">
            <div class="lg:col-span-1 h-64 lg:h-auto relative">
              <img 
                src={event.imageUrl || "https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=800&q=80"} 
                alt={event.title} 
                class="w-full h-full object-cover"
              />
            </div>
            
            <div class="lg:col-span-2 p-6 flex flex-col justify-between space-y-4">
              <div>
                <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full inline-block mb-2">
                  📍 {event.location}
                </span>
                <h2 class="text-2xl font-bold text-slate-800">{event.title}</h2>
                <p class="text-slate-600 text-sm mt-3 leading-relaxed whitespace-pre-line">{event.description}</p>
              </div>

              <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl text-xs">
                <div>
                  <span class="text-slate-400 block">📅 活動日期</span>
                  <span class="font-bold text-slate-800 mt-0.5 block">{event.startDate} ~ {event.endDate}</span>
                </div>
                <div>
                  <span class="text-slate-400 block">⛺ 額度狀況</span>
                  <span class="font-bold text-emerald-700 mt-0.5 block">上限 {event.maxTents} 帳 / 剩 {remainingTents} 帳</span>
                </div>
                <div>
                  <span class="text-slate-400 block">💰 營位費用</span>
                  <span class="font-bold text-slate-800 mt-0.5 block">NT$ {event.feePerTent} / 帳</span>
                </div>
                <div>
                  <span class="text-slate-400 block">👤 主辦人</span>
                  <span class="font-bold text-slate-800 mt-0.5 block">{event.organizer} ({event.organizerPhone || '-'})</span>
                </div>
              </div>

              {event.paymentInfo && (
                <div class="bg-amber-50 border border-amber-200/80 p-3 rounded-xl text-xs text-amber-900">
                  <span class="font-bold">💳 訂金/匯款資訊：</span> {event.paymentInfo}
                </div>
              )}

              <div class="flex items-center justify-between pt-2">
                <div class="text-xs text-slate-500">
                  目前統計：已報名 <b class="text-slate-800">{totalBookedTents}</b> 帳 / <b class="text-slate-800">{totalAdults}</b> 大 <b class="text-slate-800">{totalKids}</b> 小
                </div>

                <button 
                  disabled={isFull}
                  onClick={onOpenRegister}
                  class={`px-6 py-2.5 rounded-xl font-bold text-sm shadow transition ${
                    isFull 
                      ? 'bg-slate-300 text-slate-500 cursor-not-allowed' 
                      : 'bg-emerald-700 hover:bg-emerald-800 text-white'
                  }`}>
                  {isFull ? '🔴 已額滿' : '✍️ 我要報名參團'}
                </button>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h3 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
              <span>📋</span> 已報名露友明細 ({regs.length} 組)
            </h3>

            {regs.length === 0 ? (
              <p class="text-slate-400 text-sm py-8 text-center">尚無露友報名，成為第一個報名的人吧！</p>
            ) : (
              <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                  <thead class="bg-slate-50 text-xs text-slate-500 uppercase font-semibold">
                    <tr>
                      <th class="p-3">露友暱稱</th>
                      <th class="p-3">電話</th>
                      <th class="p-3 text-center">報名帳數</th>
                      <th class="p-3 text-center">人數 (大/小)</th>
                      <th class="p-3">車號</th>
                      <th class="p-3 text-center">夜衝</th>
                      <th class="p-3">備註 / 需求</th>
                      <th class="p-3 text-right">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    {regs.map((reg) => (
                      <tr key={reg.id} class="hover:bg-slate-50/80">
                        <td class="p-3 font-bold text-slate-800">{reg.name}</td>
                        <td class="p-3 text-slate-500">{reg.phone}</td>
                        <td class="p-3 text-center font-semibold text-emerald-700">{reg.tents || 1} 帳</td>
                        <td class="p-3 text-center">{reg.adults} 大 {reg.kids} 小</td>
                        <td class="p-3 font-mono text-xs text-slate-600">{reg.carNo || '-'}</td>
                        <td class="p-3 text-center">
                          {reg.nightArrive ? <span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs">🌙 是</span> : <span class="text-slate-400 text-xs">否</span>}
                        </td>
                        <td class="p-3 text-xs text-slate-500 max-w-xs truncate">{reg.note || '-'}</td>
                        <td class="p-3 text-right space-x-1">
                          <button 
                            onClick={() => onEditReg(reg)}
                            class="text-xs font-semibold text-amber-700 hover:bg-amber-50 px-2 py-1 rounded transition">
                            ✏️ 編輯
                          </button>
                          <button 
                            onClick={() => onCancelReg(event.id, reg.id)}
                            class="text-xs font-semibold text-rose-500 hover:bg-rose-50 px-2 py-1 rounded transition">
                            🗑️ 取消
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // 彈出視窗：露友填表報名 Modal (支援新增 & 編輯)
    // ----------------------------------------------------
    function RegisterModal({ event, initialData, onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        name: initialData ? initialData.name : '',
        phone: initialData ? initialData.phone : '',
        tents: initialData ? (initialData.tents || 1) : 1,
        adults: initialData ? (initialData.adults || 2) : 2,
        kids: initialData ? (initialData.kids || 0) : 0,
        carNo: initialData ? (initialData.carNo || '') : '',
        nightArrive: initialData ? Boolean(initialData.nightArrive) : false,
        note: initialData ? (initialData.note || '') : ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name || !formData.phone) {
          alert('請填寫姓名與電話！');
          return;
        }
        onSubmit(event.id, formData);
      };

      return (
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b pb-3">
              <h3 class="text-lg font-bold text-slate-800">
                {initialData ? '✏️ 修改報名資料' : '✍️ 報名露營活動'}
              </h3>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <p class="text-xs text-emerald-800 bg-emerald-50 p-2.5 rounded-lg mt-3 font-medium">
              活動：{event.title} ({event.startDate})
            </p>

            <form onSubmit={handleSubmit} class="mt-4 space-y-4 text-sm">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">暱稱 / 姓名 *</label>
                  <input 
                    type="text" required
                    placeholder="例: 阿傑"
                    value={formData.name}
                    onChange={e => setFormData({...formData, name: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">聯絡電話 *</label>
                  <input 
                    type="tel" required
                    placeholder="例: 0912-345678"
                    value={formData.phone}
                    onChange={e => setFormData({...formData, phone: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
              </div>

              <div class="grid grid-cols-3 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">報名帳數</label>
                  <select 
                    value={formData.tents}
                    onChange={e => setFormData({...formData, tents: Number(e.target.value)})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm">
                    <option value={1}>1 帳</option>
                    <option value={2}>2 帳</option>
                    <option value={3}>3 帳</option>
                  </select>
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">大人人數</label>
                  <input 
                    type="number" min="1" max="10"
                    value={formData.adults}
                    onChange={e => setFormData({...formData, adults: Number(e.target.value)})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">小孩人數</label>
                  <input 
                    type="number" min="0" max="10"
                    value={formData.kids}
                    onChange={e => setFormData({...formData, kids: Number(e.target.value)})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
              </div>

              <div>
                <label class="block font-medium text-slate-700 mb-1">車牌號碼 (營區開門紀錄用)</label>
                <input 
                  type="text" 
                  placeholder="例: ABC-1234"
                  value={formData.carNo}
                  onChange={e => setFormData({...formData, carNo: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm uppercase"
                />
              </div>

              <div class="flex items-center gap-2 bg-purple-50 p-3 rounded-lg border border-purple-100">
                <input 
                  type="checkbox" 
                  id="nightArrive"
                  checked={formData.nightArrive}
                  onChange={e => setFormData({...formData, nightArrive: e.target.checked})}
                  class="w-4 h-4 text-purple-600 rounded"
                />
                <label htmlFor="nightArrive" class="text-xs text-purple-900 font-medium cursor-pointer">
                  🌙 預計週五「夜衝」(入場時間詳見主辦說明)
                </label>
              </div>

              <div>
                <label class="block font-medium text-slate-700 mb-1">備註 / 租借裝備需求</label>
                <textarea 
                  rows="2"
                  placeholder="例: 需要代租客廳帳 / 預計攜帶大型寵物犬"
                  value={formData.note}
                  onChange={e => setFormData({...formData, note: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                ></textarea>
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onClick={onClose} class="px-4 py-2 text-slate-500 font-medium">取消</button>
                <button type="submit" class="px-5 py-2 bg-emerald-700 text-white font-bold rounded-lg shadow hover:bg-emerald-800">
                  {initialData ? '儲存修改' : '確認送出報名'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // 彈出視窗：發起 & 編輯露營活動 Modal
    // ----------------------------------------------------
    function EventFormModal({ title, initialData, onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        title: initialData ? initialData.title : '',
        location: initialData ? initialData.location : '',
        address: initialData ? (initialData.address || '') : '',
        startDate: initialData ? initialData.startDate : '',
        endDate: initialData ? initialData.endDate : '',
        maxTents: initialData ? (initialData.maxTents || 6) : 6,
        feePerTent: initialData ? (initialData.feePerTent || 1200) : 1200,
        organizer: initialData ? initialData.organizer : '',
        organizerPhone: initialData ? (initialData.organizerPhone || '') : '',
        paymentInfo: initialData ? (initialData.paymentInfo || '') : '',
        imageUrl: initialData ? (initialData.imageUrl || '') : '',
        description: initialData ? (initialData.description || '') : ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.title || !formData.startDate || !formData.endDate || !formData.organizer) {
          alert('請完整填寫標題、日期與主辦人資訊！');
          return;
        }
        onSubmit(formData);
      };

      return (
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto custom-scrollbar">
            <div class="flex items-center justify-between border-b pb-3">
              <h3 class="text-lg font-bold text-slate-800">{title}</h3>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-600">✕</button>
            </div>

            <form onSubmit={handleSubmit} class="mt-4 space-y-4 text-sm">
              <div>
                <label class="block font-medium text-slate-700 mb-1">活動名稱 *</label>
                <input 
                  type="text" required
                  placeholder="例: 新竹尖石 - 樹頭露營區 森林包區團"
                  value={formData.title}
                  onChange={e => setFormData({...formData, title: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">地區 (縣市/鄉鎮)</label>
                  <input 
                    type="text" required
                    placeholder="例: 新竹縣尖石鄉"
                    value={formData.location}
                    onChange={e => setFormData({...formData, location: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">預計開放帳數 *</label>
                  <input 
                    type="number" min="1" max="50" required
                    value={formData.maxTents}
                    onChange={e => setFormData({...formData, maxTents: Number(e.target.value)})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">開始日期 *</label>
                  <input 
                    type="date" required
                    value={formData.startDate}
                    onChange={e => setFormData({...formData, startDate: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">結束日期 *</label>
                  <input 
                    type="date" required
                    value={formData.endDate}
                    onChange={e => setFormData({...formData, endDate: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-medium text-slate-700 mb-1">每帳費用 (NT$)</label>
                  <input 
                    type="number" step="100"
                    value={formData.feePerTent}
                    onChange={e => setFormData({...formData, feePerTent: Number(e.target.value)})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
                <div>
                  <label class="block font-medium text-slate-700 mb-1">主辦人暱稱 *</label>
                  <input 
                    type="text" required
                    placeholder="例: 大熊"
                    value={formData.organizer}
                    onChange={e => setFormData({...formData, organizer: e.target.value})}
                    class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                  />
                </div>
              </div>

              <div>
                <label class="block font-medium text-slate-700 mb-1">訂金 / 匯款資訊</label>
                <input 
                  type="text" 
                  placeholder="例: 中國信託 (822) 1234-5678-9012 (戶名: 陳大熊)"
                  value={formData.paymentInfo}
                  onChange={e => setFormData({...formData, paymentInfo: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                />
              </div>

              <div>
                <label class="block font-medium text-slate-700 mb-1">營地封面照片網址 (選填)</label>
                <input 
                  type="url" 
                  placeholder="https://..."
                  value={formData.imageUrl}
                  onChange={e => setFormData({...formData, imageUrl: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                />
              </div>

              <div>
                <label class="block font-medium text-slate-700 mb-1">活動簡介與營區注意事項</label>
                <textarea 
                  rows="3"
                  placeholder="詳細介紹營區設施、夜衝規定、退款規則等..."
                  value={formData.description}
                  onChange={e => setFormData({...formData, description: e.target.value})}
                  class="w-full p-2 border border-slate-300 rounded-lg text-sm"
                ></textarea>
              </div>

              <div class="flex justify-end gap-2 pt-2 border-t">
                <button type="button" onClick={onClose} class="px-4 py-2 text-slate-500 font-medium">取消</button>
                <button type="submit" class="px-5 py-2 bg-emerald-700 text-white font-bold rounded-lg shadow hover:bg-emerald-800">
                  {initialData ? '儲存修改' : '發起露營活動'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
