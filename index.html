<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌲 假日逃離計畫 - 今晚睡哪裡？先報名再說</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #F5F1E8;
      --bg-section: #EEEADF;
      --bg-card: #FFFDF8;
      --green-dark: #3F5144;
      --green-dark-hover: #2F3D33;
      --green: #7C8D78;
      --green-hover: #657662;
      --brown: #B8794A;
      --brown-hover: #9F633D;
      --text-main: #30332F;
      --text-secondary: #5A5F56;
      --text-disabled: #AAA99F;
      --border: #DDD8CB;
      --success-bg: #E1E8DD;
      --success-text: #52664F;
      --shadow: 0 4px 16px rgba(48, 51, 47, 0.06);
    }

    /* 👴 年紀友善基礎字級放大 (16px base) */
    html {
      font-size: 16px;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    .btn-rounded {
      border-radius: 10px;
    }

    .card-outdoor {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 16px;
      transition: all 0.25s ease;
    }

    .card-outdoor:hover {
      border-color: #B8BDAF;
      transform: translateY(-2px);
    }

    .input-outdoor {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 10px;
      font-size: 1rem;
    }

    .input-outdoor:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(124, 141, 120, 0.15);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ⚡ Supabase 連線設定
    const SUPABASE_URL = "https://tmkiawfnjmkruncodpql.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MEa8eCTpoPqwdK9BfKUdqA_Yen0Q3E4";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const AVATAR_COLORS = [
      { bg: '#E3E5D9', text: '#3F5144' },
      { bg: '#D9DFD1', text: '#30332F' },
      { bg: '#E4DCCB', text: '#3F5144' },
      { bg: '#D8E1E0', text: '#30332F' },
      { bg: '#E7D5C7', text: '#B8794A' }
    ];

    function App() {
      const [events, setEvents] = useState([]);
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('⚡ 連線雲端逃離基地...');
      const [currentView, setCurrentView] = useState('list');
      const [selectedEvent, setSelectedEvent] = useState(null);
      
      // Modals
      const [showRegisterModal, setShowRegisterModal] = useState(false);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);
      const [editingRegister, setEditingRegister] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');

      const loadEventsFromSupabase = async () => {
        setLoading(true);
        setSyncStatus('⚡ 正在同步最新逃離計畫...');
        try {
          const { data: eventsData, error: evErr } = await supabase
            .from('events')
            .select('*')
            .order('created_at', { ascending: false });

          if (evErr) throw evErr;

          const { data: regsData, error: regErr } = await supabase
            .from('registrations')
            .select('*');

          if (regErr) throw regErr;

          const eventsMap = (eventsData || []).map(evt => {
            const regs = (regsData || []).filter(r => String(r.eventId) === String(evt.id));
            return {
              ...evt,
              registrations: regs
            };
          });

          setEvents(eventsMap);

          if (selectedEvent) {
            const updatedSel = eventsMap.find(e => String(e.id) === String(selectedEvent.id));
            setSelectedEvent(updatedSel || null);
          }

          setSyncStatus('🌲 雲端資料同步中');
        } catch (err) {
          console.error("Supabase fetch error:", err);
          setSyncStatus('⚠️ 連線失敗，請確認 SQL 欄位');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadEventsFromSupabase();

        const subscription = supabase
          .channel('schema-db-changes')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => {
            loadEventsFromSupabase();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(subscription);
        };
      }, []);

      const filteredEvents = useMemo(() => {
        return events.filter(e => 
          (e.title || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.location || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
          (e.organizer || '').toLowerCase().includes(searchTerm.toLowerCase())
        );
      }, [events, searchTerm]);

      const handleRegisterSubmit = async (eventId, regData) => {
        const newReg = { 
          id: 'reg-' + Date.now(),
          eventId: String(eventId),
          name: regData.name,
          phone: regData.phone,
          tents: Number(regData.tents || 1),
          adults: Number(regData.adults || 0),
          kids: Number(regData.kids || 0),
          carNo: regData.carNo || '',
          nightArrive: Boolean(regData.nightArrive),
          note: regData.note || ''
        };

        setShowRegisterModal(false);

        try {
          setSyncStatus('⚡ 正在將您加入逃離名單...');
          const { error } = await supabase.from('registrations').insert([newReg]);
          if (error) throw error;

          setSyncStatus('✅ 成功加入這場逃離！');
          alert('🎉 成功加入這場逃離！一起準備出發吧～');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Register submit error:", err);
          alert('⚠️ 加入失敗：' + (err.message || '請檢查權限'));
        }
      };

      const handleUpdateRegistration = async (regId, updatedData) => {
        setEditingRegister(null);
        try {
          setSyncStatus('⚡ 正在更新報名資料...');
          const { error } = await supabase
            .from('registrations')
            .update({
              name: updatedData.name,
              phone: updatedData.phone,
              tents: Number(updatedData.tents || 1),
              adults: Number(updatedData.adults || 0),
              kids: Number(updatedData.kids || 0),
              carNo: updatedData.carNo || '',
              nightArrive: Boolean(updatedData.nightArrive),
              note: updatedData.note || ''
            })
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('✅ 報名紀錄更新成功！');
          alert('✏️ 逃離夥伴資料已修改！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update reg error:", err);
          alert('⚠️ 更新失敗：' + err.message);
        }
      };

      const handleCancelRegistration = async (eventId, regId) => {
        if (!confirm('確定要退出這場逃離計畫嗎？')) return;

        try {
          setSyncStatus('⚡ 正在移除逃離夥伴...');
          const { error } = await supabase
            .from('registrations')
            .delete()
            .eq('id', String(regId));

          if (error) throw error;

          setSyncStatus('✅ 紀錄已移除');
          alert('已成功退出此活動');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete reg error:", err);
          alert('⚠️ 移除失敗：' + err.message);
        }
      };

      const handleCreateEvent = async (newEventData) => {
        const newEvent = {
          id: 'evt-' + Date.now(),
          title: newEventData.title,
          location: newEventData.location,
          address: newEventData.address || '',
          startDate: newEventData.startDate,
          endDate: newEventData.endDate,
          deadlineDate: newEventData.deadlineDate || '',
          campUrl: newEventData.campUrl || '',
          organizer: newEventData.organizer,
          organizerPhone: newEventData.organizerPhone || '',
          description: newEventData.description || ''
        };

        setShowCreateModal(false);

        try {
          setSyncStatus('⚡ 正在發起逃離計畫...');
          const { error } = await supabase.from('events').insert([newEvent]);
          if (error) throw error;

          setSyncStatus('✅ 逃離計畫發起成功！');
          alert('🌲 假日逃離計畫發起成功！邀約朋友一起加入吧！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Create event error:", err);
          alert('⚠️ 發起失敗：' + (err.message || '請確認 SQL 是否執行新增欄位'));
        }
      };

      const handleUpdateEvent = async (eventId, updatedData) => {
        setEditingEvent(null);
        try {
          setSyncStatus('⚡ 正在更新逃離計畫...');
          const { error } = await supabase
            .from('events')
            .update({
              title: updatedData.title,
              location: updatedData.location,
              address: updatedData.address || '',
              startDate: updatedData.startDate,
              endDate: updatedData.endDate,
              deadlineDate: updatedData.deadlineDate || '',
              campUrl: updatedData.campUrl || '',
              organizer: updatedData.organizer,
              organizerPhone: updatedData.organizerPhone || '',
              description: updatedData.description || ''
            })
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('✅ 逃離計畫更新成功！');
          alert('✏️ 活動內容已更新！');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Update event error:", err);
          alert('⚠️ 更新失敗：' + err.message);
        }
      };

      const handleDeleteEvent = async (eventId) => {
        if (!confirm('⚠️ 確定要取消這整場假日逃離計畫嗎？所有夥伴資料將一併刪除。')) return;

        setSelectedEvent(null);

        try {
          setSyncStatus('⚡ 正在刪除計畫...');
          const { error } = await supabase
            .from('events')
            .delete()
            .eq('id', String(eventId));

          if (error) throw error;

          setSyncStatus('✅ 逃離計畫已刪除');
          alert('已刪除此逃離計畫');
          loadEventsFromSupabase();
        } catch (err) {
          console.error("Delete event error:", err);
          alert('⚠️ 刪除失敗：' + err.message);
        }
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* 頂部導覽列 Header */}
          <header class="bg-[#3F5144] text-[#FFFDF8] shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="flex items-center justify-between w-full sm:w-auto cursor-pointer" onClick={() => { setSelectedEvent(null); loadEventsFromSupabase(); }}>
                <div class="flex items-center gap-3">
                  <span class="text-3xl sm:text-4xl">🌾</span>
                  <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide text-[#FFFDF8] flex items-center gap-2">
                      假日逃離計畫
                    </h1>
                    <p class="text-xs sm:text-sm text-[#E1E8DD] font-medium mt-0.5">今晚睡哪裡？先報名再說</p>
                  </div>
                </div>

                <button 
                  onClick={(e) => { e.stopPropagation(); setShowCreateModal(true); }}
                  class="sm:hidden bg-[#3F5144] hover:bg-[#2F3D33] active:bg-[#26332A] text-[#FFFDF8] border border-[#7C8D78] font-bold px-3.5 py-2 btn-rounded text-sm flex items-center gap-1 shadow-sm">
                  <span>🌲</span> 發起逃離
                </button>
              </div>

              <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                <button 
                  onClick={loadEventsFromSupabase}
                  title="重新載入數據"
                  class="bg-[#2F3D33] hover:bg-[#26332A] text-[#E1E8DD] text-xs sm:text-sm px-3.5 py-2 btn-rounded flex items-center gap-1 border border-[#7C8D78]/40 font-medium">
                  <span>🔄</span> 重新整理
                </button>

                <div class="bg-[#2F3D33]/80 p-1 rounded-xl flex gap-1 text-xs sm:text-sm font-medium">
                  <button 
                    onClick={() => { setCurrentView('list'); setSelectedEvent(null); }}
                    class={`px-3.5 py-2 btn-rounded transition ${currentView === 'list' ? 'bg-[#FFFDF8] text-[#30332F] font-bold shadow-xs' : 'text-[#E1E8DD] hover:text-white'}`}>
                    📋 逃離清單
                  </button>
                  <button 
                    onClick={() => { setCurrentView('calendar'); setSelectedEvent(null); }}
                    class={`px-3.5 py-2 btn-rounded transition ${currentView === 'calendar' ? 'bg-[#FFFDF8] text-[#30332F] font-bold shadow-xs' : 'text-[#E1E8DD] hover:text-white'}`}>
                    📅 逃離月曆
                  </button>
                </div>

                <button 
                  onClick={() => setShowCreateModal(true)}
                  class="hidden sm:flex bg-[#3F5144] hover:bg-[#2F3D33] active:bg-[#26332A] text-[#FFFDF8] font-bold px-4 py-2.5 btn-rounded shadow-sm transition items-center gap-1.5 text-base border border-[#7C8D78]">
                  <span>🌲</span> 發起逃離
                </button>
              </div>
            </div>
          </header>

          {/* 雲端同步狀態 */}
          <div class="bg-[#30332F] text-[#E1E8DD] text-xs sm:text-sm py-2 px-4 text-center font-medium flex items-center justify-center gap-2">
            <span>{syncStatus}</span>
            {loading && <span class="animate-spin">🌿</span>}
          </div>

          {/* 主要內容區 */}
          <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
            {selectedEvent ? (
              <EventDetailView 
                event={selectedEvent} 
                onBack={() => setSelectedEvent(null)}
                onOpenRegister={() => setShowRegisterModal(true)}
                onCancelReg={handleCancelRegistration}
                onDeleteEvent={handleDeleteEvent}
                onEditEvent={(evt) => setEditingEvent(evt)}
                onEditReg={(reg) => setEditingRegister(reg)}
              />
            ) : (
              <div>
                <div class="mb-6 flex flex-col sm:flex-row items-center justify-between gap-4 bg-[#FFFDF8] p-4.5 rounded-2xl border border-[#DDD8CB] shadow-xs">
                  <div class="relative w-full sm:w-80">
                    <input 
                      type="text"
                      placeholder="搜尋逃離地點、營地或發起人..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      class="w-full pl-10 pr-4 py-2.5 input-outdoor text-base"
                    />
                    <span class="absolute left-3.5 top-3 text-[#5A5F56] text-lg">🔍</span>
                  </div>

                  <div class="text-sm sm:text-base text-[#5A5F56] font-medium self-end sm:self-center">
                    目前共有 <span class="text-[#3F5144] font-bold text-lg sm:text-xl">{filteredEvents.length}</span> 場逃離計畫
                  </div>
                </div>

                {loading && events.length === 0 ? (
                  <div class="text-center py-20 bg-[#FFFDF8] rounded-2xl border border-[#DDD8CB]">
                    <div class="text-5xl animate-bounce mb-3">🌾</div>
                    <p class="text-[#5A5F56] font-medium text-base">正在讀取最新的假日逃離計畫...</p>
                  </div>
                ) : (
                  currentView === 'list' ? (
                    <EventListView events={filteredEvents} onSelectEvent={setSelectedEvent} />
                  ) : (
                    <CalendarView events={events} onSelectEvent={setSelectedEvent} />
                  )
                )}
              </div>
            )}
          </main>

          {/* 頁尾 */}
          <footer class="bg-[#30332F] text-[#737970] py-8 border-t border-[#3F5144] text-center text-sm mt-12 space-y-1">
            <p class="text-[#E1E8DD] font-medium text-base">🌾 假日逃離計畫 - 今晚睡哪裡？先報名再說</p>
            <p class="text-[#AAA99F]">Outdoor Lifestyle & Escape Plan System</p>
          </footer>

          {/* Modals */}
          {showRegisterModal && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              onClose={() => setShowRegisterModal(false)}
              onSubmit={handleRegisterSubmit}
            />
          )}

          {showCreateModal && (
            <EventFormModal 
              title="🌲 發起一場假日逃離計畫"
              onClose={() => setShowCreateModal(false)}
              onSubmit={handleCreateEvent}
            />
          )}

          {editingEvent && (
            <EventFormModal 
              title="✏️ 編輯逃離計畫"
              initialData={editingEvent}
              onClose={() => setEditingEvent(null)}
              onSubmit={(data) => handleUpdateEvent(editingEvent.id, data)}
            />
          )}

          {editingRegister && selectedEvent && (
            <RegisterModal 
              event={selectedEvent}
              initialData={editingRegister}
              onClose={() => setEditingRegister(null)}
              onSubmit={(eventId, data) => handleUpdateRegistration(editingRegister.id, data)}
            />
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    // 組件 1：活動卡片列表視圖 (大字年紀友善 & 移除長條框背景)
    // ----------------------------------------------------
    function EventListView({ events, onSelectEvent }) {
      if (events.length === 0) {
        return (
          <div class="text-center py-16 bg-[#FFFDF8] rounded-2xl border border-dashed border-[#DDD8CB]">
            <div class="text-5xl mb-3">🏕️</div>
            <h3 class="text-xl font-bold text-[#30332F]">目前沒有規劃中的逃離計畫</h3>
            <p class="text-[#5A5F56] text-base mt-2">點擊右上角的「發起逃離」，揪朋友一起去戶外吧！</p>
          </div>
        );
      }

      return (
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          {events.map(evt => {
            const regs = evt.registrations || [];
            const totalPeople = regs.reduce((sum, r) => sum + Number(r.adults || 0) + Number(r.kids || 0), 0);
            const totalTents = regs.reduce((sum, r) => sum + Number(r.tents || 1), 0);

            const isExpired = evt.deadlineDate && new Date().toISOString().split('T')[0] > evt.deadlineDate;

            return (
              <div 
                key={evt.id} 
                onClick={() => onSelectEvent(evt)}
                class="card-outdoor p-5 sm:p-6 flex flex-col justify-between cursor-pointer group space-y-4">
                
                <div>
                  {/* 1. 上面日期 (大字、無背景長條框) */}
                  <div class="flex items-center justify-between mb-3 border-b border-[#DDD8CB]/60 pb-3">
                    <div class="flex items-center gap-1 font-bold text-[#B8794A] text-sm sm:text-base">
                      <span>📅 活動日期：</span>
                      <span>{evt.startDate} ～ {evt.endDate}</span>
                    </div>

                    {isExpired ? (
                      <span class="bg-[#E5E1D9] text-[#77736A] px-3 py-1 rounded-full text-xs sm:text-sm font-bold shrink-0">
                        已截止
                      </span>
                    ) : (
                      <span class="bg-[#E1E8DD] text-[#52664F] px-3 py-1 rounded-full text-xs sm:text-sm font-bold shrink-0">
                        尚有名額
                      </span>
                    )}
                  </div>

                  {/* 2. 中間活動大標題 (年紀友善 20px/22px 大字) */}
                  <h3 class="font-bold text-[#30332F] text-xl sm:text-2xl group-hover:text-[#3F5144] transition line-clamp-1 mb-4">
                    {evt.title}
                  </h3>

                  {/* 3. 下方屬性清單 (完全移除長條框背景色，採用無邊框優雅大字條列) */}
                  <div class="space-y-2.5 text-sm sm:text-base">
                    {/* (1) 地點 */}
                    <div class="flex items-center justify-between py-1 border-b border-dashed border-[#DDD8CB]/40">
                      <span class="text-[#5A5F56] font-medium flex items-center gap-1">
                        📍 逃離地點
                      </span>
                      <span class="font-bold text-[#30332F] text-base sm:text-lg">{evt.location}</span>
                    </div>

                    {/* (2) 報名截止 */}
                    <div class="flex items-center justify-between py-1 border-b border-dashed border-[#DDD8CB]/40">
                      <span class="text-[#5A5F56] font-medium flex items-center gap-1">
                        ⏳ 報名截止
                      </span>
                      <span class="font-bold text-[#B8794A] text-base sm:text-lg">{evt.deadlineDate || '無期限'}</span>
                    </div>

                    {/* (3) 發起人 */}
                    <div class="flex items-center justify-between py-1 border-b border-dashed border-[#DDD8CB]/40">
                      <span class="text-[#5A5F56] font-medium flex items-center gap-1">
                        👤 發起人
                      </span>
                      <span class="font-bold text-[#30332F] text-base sm:text-lg">{evt.organizer}</span>
                    </div>

                    {/* (4) 目前夥伴 */}
                    <div class="flex items-center justify-between py-1">
                      <span class="text-[#5A5F56] font-medium flex items-center gap-1">
                        🏕️ 目前夥伴
                      </span>
                      <span class="font-bold text-[#3F5144] text-base sm:text-lg">{regs.length} 組 ({totalTents} 帳 / {totalPeople} 人)</span>
                    </div>
                  </div>
                </div>

                {/* 4. 底部按鈕 焦糖棕特調 CTA (大字大按紐) */}
                <div class="pt-4 border-t border-[#DDD8CB] flex items-center justify-between">

    // ----------------------------------------------------
    // 組件 2：月曆視圖 (大字優化)
    // ----------------------------------------------------
    function CalendarView({ events, onSelectEvent }) {
      const today = new Date();
      const [currentMonth, setCurrentMonth] = useState(today);

      const daysInMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0).getDate();
      const firstDayOfWeek = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth() + 1;

      const calendarDays = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        calendarDays.push(null);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        calendarDays.push({ day: d, dateStr });
      }

      return (
        <div class="bg-[#FFFDF8] rounded-2xl p-4 sm:p-6 border border-[#DDD8CB] shadow-xs overflow-hidden">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4 sm:mb-6">
            <h2 class="text-xl sm:text-2xl font-bold text-[#3F5144] flex items-center gap-2">
              <span>📅</span> {year} 年 {month} 月 逃離月曆
            </h2>
            <div class="flex items-center gap-2 justify-between">
              <button onClick={() => setCurrentMonth(new Date(year, month - 2, 1))} class="px-3 py-2 bg-[#EEEADF] hover:bg-[#E4DCCB] rounded-lg text-sm font-bold text-[#30332F]">◀ 上個月</button>
              <button onClick={() => setCurrentMonth(new Date())} class="px-3 py-2 bg-[#E1E8DD] text-[#52664F] hover:bg-[#D9DFD1] rounded-lg text-sm font-bold">今天</button>
              <button onClick={() => setCurrentMonth(new Date(year, month, 1))} class="px-3 py-2 bg-[#EEEADF] hover:bg-[#E4DCCB] rounded-lg text-sm font-bold text-[#30332F]">下個月 ▶</button>
            </div>
          </div>

          <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-sm font-bold text-[#5A5F56] mb-2">
            <div class="text-[#B8794A]">日</div>
            <div>一</div>
            <div>二</div>
            <div>三</div>
            <div>四</div>
            <div>五</div>
            <div class="text-[#3F5144]">六</div>
          </div>

          <div class="grid grid-cols-7 gap-1 sm:gap-2">
            {calendarDays.map((cell, idx) => {
              if (!cell) return <div key={'empty-' + idx} class="h-16 sm:h-28 bg-[#F5F1E8]/40 rounded-lg sm:rounded-xl"></div>;

              const dayEvents = events.filter(e => cell.dateStr >= e.startDate && cell.dateStr <= e.endDate);
              const hasEvents = dayEvents.length > 0;

              return (
                <div key={cell.dateStr} class="min-h-[64px] sm:h-28 bg-[#F5F1E8] hover:bg-[#EEEADF] p-1.5 sm:p-2 rounded-lg sm:rounded-xl border border-[#DDD8CB]/60 flex flex-col justify-between overflow-hidden">
                  <div class="flex items-center justify-between">
                    <span class="text-xs sm:text-sm font-bold text-[#30332F]">{cell.day}</span>
                    {hasEvents && <span class="sm:hidden text-[10px] bg-[#3F5144] text-white px-1.5 py-0.2 rounded-full font-bold">{dayEvents.length}</span>}
                  </div>
                  
                  <div class="space-y-1 overflow-y-auto custom-scrollbar flex-grow mt-1">
                    {dayEvents.map(evt => (
                      <div 
                        key={evt.id}
                        onClick={() => onSelectEvent(evt)}
                        class="bg-[#3F5144] text-[#FFFDF8] text-xs sm:text-sm p-1 sm:p-1.5 rounded sm:rounded-lg cursor-pointer hover:bg-[#2F3D33] transition font-medium leading-tight"
                        title={evt.title}>
                        <div class="truncate">🌾 {evt.title}</div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------

    function RegisterModal({ event, initialData, onClose, onSubmit }) {
      const [formData, setFormData] = useState({
        name: initialData ? initialData.name : '',
        phone: initialData ? initialData.phone : '',

        e.preventDefault();

                    type="tel"
                    placeholder="例: 0912-345678"
                    value={formData.organizerPhone}
                    onChange={e => setFormData({...formData, organizerPhone: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
                <div>
                  <label class="block font-bold text-[#30332F] mb-1">營地連結網址 (選填)</label>
                  <input 
                    type="url"
                    placeholder="https://..."
                    value={formData.campUrl}
                    onChange={e => setFormData({...formData, campUrl: e.target.value})}
                    class="w-full p-2.5 input-outdoor"
                  />
                </div>
              </div>

              <div>
                <label class="block font-bold text-[#30332F] mb-1">計畫簡介與裝備提醒</label>
                <textarea 
                  rows="3"
                  placeholder="介紹營地特色、注意事項、伙食規劃..."
                  value={formData.description}
                  onChange={e => setFormData({...formData, description: e.target.value})}
                  class="w-full p-2.5 input-outdoor"
                ></textarea>
              </div>

              <div class="flex justify-end gap-3 pt-3 border-t border-[#DDD8CB]">
                <button type="button" onClick={onClose} class="px-5 py-2.5 text-[#5A5F56] font-bold">取消</button>
                <button type="submit" class="px-7 py-2.5 bg-[#3F5144] hover:bg-[#2F3D33] active:bg-[#26332A] text-[#FFFDF8] font-bold btn-rounded shadow-sm text-base">
                  {initialData ? '儲存修改' : '發起逃離'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
